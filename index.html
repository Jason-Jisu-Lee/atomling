<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Atomling</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="game">
  <div id="chamberWrap">
    <canvas id="chamber"></canvas>
    <div id="toast" hidden></div>
    <button id="reset" type="button" title=""></button>
  </div>
  <div id="panel">
    <div id="tabbar">
      <button class="tab on" data-tab="0" type="button"><span class="ico bar"></span></button>
      <button class="tab" data-tab="1" type="button"><span class="ico up"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
    </div>
    <div id="tabContent"></div>
  </div>
</div>
<div id="tip" hidden></div>
<div id="debug" hidden>
  <div class="dhead">DEBUG</div>
  <pre id="dstats"></pre>
  <div class="dsec">grant</div>
  <div id="dgrant"></div>
  <div class="dsec">time</div>
  <div class="drow">
    <button data-ts="1" class="on" type="button">x1</button>
    <button data-ts="5" type="button">x5</button>
    <button data-ts="20" type="button">x20</button>
  </div>
  <div class="dsec">save</div>
  <div class="drow">
    <button id="dsave" type="button">save</button>
    <button id="dwipe" type="button">wipe</button>
  </div>
</div>
<script src="game.js?v=5"></script>
</body>
</html>
