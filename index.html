<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Atomling</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="game">
  <div id="chamberWrap">
    <canvas id="chamber"></canvas>
    <div id="toast" hidden></div>
    <button id="reset" type="button" title=""></button>
  </div>
  <div id="panel">
    <div id="tabbar">
      <button class="tab on" data-tab="0" type="button"><span class="ico bar"></span></button>
      <button class="tab" data-tab="1" type="button"><span class="ico up"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
      <button class="tab lock" type="button"><span class="ico padlock"></span></button>
    </div>
    <div id="tabContent"></div>
  </div>
</div>
<div id="tip" hidden></div>
<script src="game.js?v=2"></script>
</body>
</html>
